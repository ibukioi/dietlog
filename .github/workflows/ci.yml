name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:ci.db
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-000000
      BETTER_AUTH_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
      IP_HASH_SALT: ci-salt
      GUEST_CREATE_LIMIT_PER_HOUR: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
